services:
  traeky:
    image: pandabytelabs/traeky:latest
    container_name: traeky
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      TRAEKY_ALLOWED_HOSTS: "all" # Default: allow all hosts (recommended to override in production)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s