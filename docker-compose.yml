services:
  traeky:
    build: .
    image: traeky:local
    ports:
      - "8080:8080"
    environment:
      TRAEKY_ADDR: ":8080"
      TRAEKY_MODE: "all"
      TRAEKY_DATA_DIR: "/data"
      # Set this when the browser frontend is served from another origin:
      # TRAEKY_CORS_ORIGINS: "https://traeky.example.org"
    volumes:
      - traeky-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  traeky-data:
